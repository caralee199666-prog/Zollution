[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/**", "uploads/**", "src/**"]

# Static assets served directly from public/
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/logo.png"
  to = "/logo.png"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "/favicon.png"
  status = 200

# Dynamic server routes handled by Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/download/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/order-success"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/zol-portal-access"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/zol-portal-access/*"
  to = "/.netlify/functions/server"
  status = 200

# Homepage rendered dynamically with products
[[redirects]]
  from = "/"
  to = "/.netlify/functions/server"
  status = 200
